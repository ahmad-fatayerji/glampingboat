name: glampingboat-account-security-dev

services:
  db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glampingboat_dev
      POSTGRES_PASSWORD: glampingboat_dev
      POSTGRES_DB: glampingboat_security
    ports:
      - "55432:5432"
    volumes:
      - account_security_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U glampingboat_dev -d glampingboat_security",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  account_security_postgres:
